name: Probe hotfixes (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe wago.tools
        run: |
          UA="CraftPath recipe sync (+https://github.com/Thomas-Rice/craftpath)"
          curl -sS -A "$UA" "https://wago.tools/build/assets/app-CyYaB7ID.js" -o app.js
          grep -o '"[^"]*Hotfix[^"]*"' app.js | sort -u | head -20 | sed 's/^/OUT name /'
          grep -o './Pages/Hotfixes[^"]*"\?[^)]*' app.js | head -5 | sed 's/^/OUT imp /'
          for c in $(grep -oE 'Hotfixes[A-Za-z0-9_.-]*\.js' app.js | sort -u); do
            curl -sS -A "$UA" "https://wago.tools/build/assets/$c" -o h.js
            echo "OUT chunk $c size $(wc -c < h.js)"
            grep -oE '.{100}route\("hotfixes".{200}' h.js | head -5 | sed 's/^/OUT R /'
            grep -oE '.{80}(filters\.|filters\[).{120}' h.js | head -15 | sed 's/^/OUT F /'
            grep -oE '(search|table|locale|build|status|per_page|perPage|region|onlyLatest|latest|tableName)\s*:' h.js | sort | uniq -c | sed 's/^/OUT P /'
          done
