name: Probe wiki (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe warcraft.wiki.gg
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse
          UA = "CraftPath recipe sync (+https://github.com/Thomas-Rice/craftpath)"
          pages = {"Blacksmithing": "Forever blacksmithing plans", "Engineering": "Forever engineering schematics",
                   "Alchemy": "Forever alchemy recipes", "Tailoring": "Forever tailoring patterns",
                   "Leatherworking": "Forever leatherworking patterns", "Enchanting": "Forever enchanting formulas",
                   "Cooking": "Forever cooking recipes", "First Aid": "Forever first aid recipes",
                   "Mining": "Forever mining techniques"}
          for prof, title in pages.items():
              url = "https://warcraft.wiki.gg/api.php?action=parse&format=json&prop=wikitext&page=" + urllib.parse.quote(title)
              t = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA})))["parse"]["wikitext"]["*"]
              n = 0
              for m in re.finditer(r"^\|\s*\[\[([^\]|]+)(?:\|[^\]]*)?\]\]\s*\|\|\s*(\d+)\s*\|\|.*?\|\|.*?\|\|\s*(.*?)\s*$", t, re.M):
                  print(f"OUT ROW {prof}|{m.group(1)}|{m.group(2)}|{m.group(3)}")
                  n += 1
              print(f"OUT COUNT {prof} {n} rows, {len(t)} chars")
          PY
