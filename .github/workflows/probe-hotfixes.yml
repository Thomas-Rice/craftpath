name: Probe hotfixes (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe wago.tools
        run: |
          UA="CraftPath recipe sync (+https://github.com/Thomas-Rice/craftpath)"
          V=7e6126634325be55fb95f48ee768ce01
          ij() { curl -sS -g -A "$UA" -H "X-Inertia: true" -H "X-Inertia-Version: $V" -H "X-Requested-With: XMLHttpRequest" "$1"; }
          show() {
            python3 -c "
          import json,sys
          raw=sys.stdin.read()
          try: d=json.loads(raw)
          except Exception: print('OUT not json', raw[:300]); sys.exit()
          p=d.get('props',d)
          print('OUT filters', p.get('filters'), 'pageMeta', json.dumps(p.get('pageMeta'))[:300])
          h=p.get('hotfixes') or {}
          print('OUT meta', {k:v for k,v in h.items() if k!='data' and k!='links'})
          rows=h.get('data',[])
          from collections import Counter
          print('OUT tables', Counter(r['table_name'] for r in rows).most_common(12))
          print('OUT dates', rows[0]['created_at'] if rows else None, rows[-1]['created_at'] if rows else None)
          for r in rows:
              if r['table_name'] in ('ItemSparse','SkillLineAbility') and r['record_id'] in (4390,247754,1861,3326):
                  print('OUT HIT', json.dumps(r)[:700])
          "
          }
          echo "OUT === base"; ij "https://wago.tools/hotfixes?product=wowf" | show
          for q in "search=4390" "search=itemsparse%204390" "table=ItemSparse" "table_name=ItemSparse" "search=skilllineability" "search=1861"; do
            echo "OUT === $q"; ij "https://wago.tools/hotfixes?product=wowf&$q" | show
          done
          echo "OUT === page 50"; ij "https://wago.tools/hotfixes?product=wowf&page=50" | show
