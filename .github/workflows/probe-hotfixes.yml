name: Probe recipes (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look at a few recipes in the game data
        run: |
          cd tools && python3 - <<'PY'
          import sync_recipes as s
          build = s.latest_build() if hasattr(s, "latest_build") else None
          print("OUT build", build)
          t = s.read_tables(build)
          names = {"Anvil", "Repair Bot", "Reagent Bot", "Tanning Rack", "Mana Well", "Iron Buckle"}
          spells = {r["ID"]: r["Name_lang"] for r in t["SpellName"] if r.get("Name_lang") in names}
          print("OUT spells", spells)
          for r in t["SkillLineAbility"]:
              if r.get("Spell") in spells:
                  print("OUT SLA", spells[r["Spell"]], {k: r[k] for k in ("SkillLine", "MinSkillLineRank", "AcquireMethod", "TrivialSkillLineRankLow", "TrivialSkillLineRankHigh", "NumSkillUps") if k in r})
          for r in t["SpellReagents"]:
              if r.get("SpellID") in spells:
                  print("OUT REG", spells[r["SpellID"]], [r.get(f"Reagent_{i}") for i in range(4)])
          for r in t["SpellEffect"]:
              if r.get("SpellID") in spells and r.get("Effect") == str(s.CREATE_ITEM):
                  print("OUT EFF", spells[r["SpellID"]], r.get("EffectItemType"))
          PY
