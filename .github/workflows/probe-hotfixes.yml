name: Probe hotfixes (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe wago.tools
        run: |
          UA="CraftPath recipe sync (+https://github.com/Thomas-Rice/craftpath)"
          V=7e6126634325be55fb95f48ee768ce01
          ij() { curl -sS -g -A "$UA" -H "X-Inertia: true" -H "X-Inertia-Version: $V" -H "X-Requested-With: XMLHttpRequest" "$1"; }
          show() {
            python3 -c "
          import json,sys
          raw=sys.stdin.read()
          try: d=json.loads(raw)
          except Exception: print('OUT not json', raw[:300]); sys.exit()
          p=d.get('props',d)
          p.pop('ziggy',None)
          print('OUT keys', list(p.keys()))
          print('OUT', json.dumps(p, default=str)[:2500])
          "
          }
          echo "OUT === hotfixes"; ij "https://wago.tools/hotfixes?product=wowf" | show
          echo "OUT === hotfixes page 1"; ij "https://wago.tools/hotfixes?product=wowf&page=1" | show
          B=1.60.1.70888
          for q in "" "&hotfixes=1" "&hotfixes=true" "&hotfix=1"; do
            echo "OUT === ItemSparse 4390 q=$q"; ij "https://wago.tools/db2/ItemSparse?build=$B&filter[ID]=exact:4390$q" | show
          done
