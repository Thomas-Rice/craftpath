name: Probe hotfixes (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe wago.tools
        run: |
          UA="CraftPath recipe sync (+https://github.com/Thomas-Rice/craftpath)"
          curl -sS -A "$UA" "https://wago.tools/hotfixes?product=wowf" -o page.html
          python3 - <<'PY'
          import re, json, html
          s = open('page.html', encoding='utf-8').read()
          m = re.search(r'const Ziggy=(\{.*?\});', s, re.S)
          z = json.loads(m.group(1))
          for k, v in z['routes'].items():
              if any(w in (k + v['uri']).lower() for w in ('hotfix', 'db2', 'api')):
                  print('ROUTE', k, v['uri'], v.get('methods'))
          m = re.search(r'data-page="([^"]+)"', s)
          if m:
              d = json.loads(html.unescape(m.group(1)))
              print('PAGE component', d.get('component'), 'version', d.get('version'))
              print('PROPS', json.dumps(d.get('props'), default=str)[:4000])
          PY
