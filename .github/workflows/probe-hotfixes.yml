name: Probe hotfixes (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe wago.tools
        run: |
          UA="CraftPath recipe sync (+https://github.com/Thomas-Rice/craftpath)"
          B=1.60.1.70888
          for q in "" "&useHotfixes=1" "&useHotfixes=1&locale=enUS"; do
            curl -sS -A "$UA" "https://wago.tools/db2/ItemSparse/csv?build=$B$q" -o is.csv -w "OUT ItemSparse q='$q' http %{http_code} %{size_download}\n"
            python3 - <<'PY'
          import csv
          for r in csv.DictReader(open('is.csv', encoding='utf-8')):
              if r.get('Display_lang') in ('Iron Grenade', 'Minor Arcane Elixir', 'Heavy Mithril Breastplate', 'Copper Chain Vest', 'Runecloth Robe'):
                  print('OUT   ', r.get('ID'), r['Display_lang'], 'Sell', r.get('SellPrice'))
          PY
            curl -sS -A "$UA" "https://wago.tools/db2/SkillLineAbility/csv?build=$B$q" -o sla.csv -w "OUT SLA q='$q' http %{http_code}\n"
            python3 - <<'PY'
          import csv
          for r in csv.DictReader(open('sla.csv', encoding='utf-8')):
              if r.get('Spell') == '3326':
                  print('OUT    Coarse Grinding Stone', r.get('TrivialSkillLineRankLow'), r.get('TrivialSkillLineRankHigh'))
          PY
          done
