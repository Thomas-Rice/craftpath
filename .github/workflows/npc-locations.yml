name: NPC locations
# Rebuilds data/npc-locations.json and CraftPath/Data/Locations.lua (trainers and material
# vendors) from cmangos classic-db and Forever's maps, and pushes them to the npc-locations branch
# for review.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install lupa
      - run: git clone -q --depth 1 https://github.com/cmangos/classic-db.git /tmp/cdb
      - run: python3 tools/npc_locations.py --cmangos /tmp/cdb/Full_DB/*.sql.gz
      - run: |
          python3 - <<'PY'
          import json
          d = json.load(open("data/npc-locations.json"))
          for p, vs in d["trainers"].items():
              for v in vs: print("T", p, v["npc"], v["zone"], v["x"], v["y"], v["faction"], v["rank"], v["upto"])
          for i, vs in d["vendors"].items():
              print("V", i, "; ".join(f"{v['npc']} {v['zone']} {v['faction']}" for v in vs))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B npc-locations
          git add data/npc-locations.json CraftPath/Data/Locations.lua
          git commit -m "NPC locations from cmangos classic-db and Forever's maps" || exit 0
          git push -f origin npc-locations
