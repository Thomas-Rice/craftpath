name: Probe cooldowns (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look at crafting cooldowns in the game data
        run: |
          cd tools && python3 - <<'PY'
          import sync_recipes as s
          build = s.newest_build()[0]
          print("OUT build", build)
          s.TABLES[:] = ["SpellName", "SpellEffect", "ItemSparse", "SkillLineAbility", "SpellCooldowns",
                         "SpellCategories", "SpellCategory"]
          t = s.read_tables(build)
          for k in ("SpellCooldowns", "SpellCategories", "SpellCategory"):
              print("OUT cols", k, list(t[k][0].keys()) if t[k] else None)
          items = {r["ID"]: r["Display_lang"] for r in t["ItemSparse"]}
          want = {"Arcanite Bar", "Mooncloth", "Gold Bar", "Truesilver Bar", "Essence of Fire", "Essence of Earth",
                  "Essence of Water", "Living Essence", "Essence of Undeath", "Elemental Fire", "Cured Rugged Hide",
                  "Refined Deeprock Salt", "Iron Bar", "Thorium Bar", "Healing Potion"}
          spells = {}
          for r in t["SpellEffect"]:
              if r.get("Effect") == str(s.CREATE_ITEM) and items.get(r.get("EffectItemType")) in want:
                  spells[r["SpellID"]] = items[r["EffectItemType"]]
          names = {r["ID"]: r["Name_lang"] for r in t["SpellName"]}
          prof = {r["Spell"]: r["SkillLine"] for r in t["SkillLineAbility"]}
          cd = {r["SpellID"]: r for r in t["SpellCooldowns"]}
          cat = {r["SpellID"]: r for r in t["SpellCategories"]}
          catrow = {r["ID"]: r for r in t["SpellCategory"]}
          for sid, item in sorted(spells.items(), key=lambda x: x[1]):
              if sid not in prof:
                  continue
              c = cd.get(sid, {}); g = cat.get(sid, {})
              cr = catrow.get(g.get("Category"), {})
              print("OUT", item, "|", names.get(sid), sid, "skill", prof[sid],
                    "| cd", {k: v for k, v in c.items() if "Time" in k},
                    "| cat", g.get("Category"), {k: v for k, v in cr.items() if k not in ("ID",)})
          PY
