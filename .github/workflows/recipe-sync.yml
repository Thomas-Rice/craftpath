# Daily recipe sync: rebuilds CraftPath's recipe data from the newest WoW: Forever client
# build on wago.tools and opens (or updates) a pull request when recipes were added,
# changed or removed. It never pushes to main: you review and merge the PR.
#
# Needs: Settings > Actions > General > Workflow permissions > "Read and write" and
# "Allow GitHub Actions to create and approve pull requests".
name: Recipe sync

on:
  schedule:
    - cron: "17 5 * * *" # every day, 05:17 UTC
  workflow_dispatch:
    inputs:
      build:
        description: "Forever build to use (blank = newest on wago.tools)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: recipe-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runtime
        run: pip install lupa

      - name: Rebuild recipe data from the Forever client tables
        id: sync
        run: python tools/sync_recipes.py ${{ inputs.build && format('--build {0}', inputs.build) || '' }}

      - name: Run tests on the new data
        if: steps.sync.outputs.changed == 'true'
        run: |
          python tests/run_tests.py
          python tests/check_addon.py
          python tests/test_sync.py

      - name: Open or update the pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: recipe-sync
          delete-branch: true
          add-paths: CraftPath/Data/*.lua
          commit-message: "Recipe data from Forever build ${{ steps.sync.outputs.build }}"
          title: "Recipe data from Forever build ${{ steps.sync.outputs.build }}"
          body-path: recipe-sync-report.md
          labels: recipe-sync
