# Daily recipe sync: rebuilds CraftPath's recipe data from the newest WoW: Forever client
# build on wago.tools and opens (or updates) a pull request when recipes were added,
# changed or removed. It never pushes to main: you review and merge the PR.
#
# Needs: Settings > Actions > General > Workflow permissions > "Read and write" and
# "Allow GitHub Actions to create and approve pull requests".
name: Recipe sync

on:
  schedule:
    - cron: "17 5 * * *" # every day, 05:17 UTC
  workflow_dispatch:
    inputs:
      build:
        description: "Forever build to use (blank = newest on wago.tools)"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: recipe-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runtime
        run: pip install lupa

      - name: Rebuild recipe data from the Forever client tables
        id: sync
        run: python tools/sync_recipes.py ${{ inputs.build && format('--build {0}', inputs.build) || '' }}

      - name: Show the report on the run page
        if: always()
        run: test -f recipe-sync-report.md && cat recipe-sync-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Run tests on the new data
        id: tests
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true # still open the PR so the new data can be looked at
        run: |
          python tests/run_tests.py
          python tests/check_addon.py
          python tests/test_sync.py

      - name: Open or update the pull request
        id: cpr
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: recipe-sync
          delete-branch: true
          add-paths: |
            CraftPath/Data/*.lua
            data/recipe-changes.json
          commit-message: "Recipe data from Forever build ${{ steps.sync.outputs.build }}"
          title: "${{ steps.tests.outcome == 'failure' && '[TESTS FAILING] ' || '' }}Recipe data from Forever build ${{ steps.sync.outputs.build }}"
          draft: ${{ steps.tests.outcome == 'failure' }}
          body-path: recipe-sync-report.md
          labels: recipe-sync

      # A new PR emails you on its own. When an open PR gets newer data, post the summary as a
      # comment so that run emails you too.
      - name: Comment the summary on an updated pull request
        if: steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "**New run: Forever build ${{ steps.sync.outputs.build }}** ([run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))"; echo; cat recipe-sync-report.md; } > comment.md
          gh pr comment "${{ steps.cpr.outputs.pull-request-number }}" --body-file comment.md

      - name: Fail the run if the tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Tests failed on the new recipe data. The PR is a draft: check it before merging."
          exit 1

      # Any failure (download, tests, PR) opens an issue, or comments on the open one, so you hear about it.
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The recipe sync failed on $(date -u +'%Y-%m-%d %H:%M') UTC. Run log: $url"
          n=$(gh issue list --label recipe-sync-failed --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh label create recipe-sync-failed --color B60205 --force >/dev/null
            gh issue create --title "Recipe sync failed" --label recipe-sync-failed --body "$body"
          fi
